<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noly – Dashboard</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0b;
            --bg-secondary: #111113;
            --bg-card: #18181b;
            --bg-elevated: #1f1f23;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --text: rgba(255,255,255,0.9);
            --text-secondary: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.4);
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --accent-soft: rgba(168,85,247,0.15);
            --accent-glow: rgba(168,85,247,0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ==================== LOGIN ==================== */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            overflow-y: auto;
        }
        #loginScreen.hidden { display: none; }
        
        .login-container { width: 100%; max-width: 400px; }
        
        .login-header { text-align: center; margin-bottom: 32px; }
        
        .login-logo { font-size: 2.5rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .login-logo span { color: var(--accent); }
        
        .login-subtitle { color: var(--text-secondary); font-size: 0.95rem; }
        
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }
        
        .form-group { margin-bottom: 20px; }
        
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-input::placeholder { color: var(--text-muted); }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card); border-color: var(--border-hover); }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .login-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        
        .form-toggle { display: none; }
        .form-toggle.active { display: block; }
        
        /* ==================== APP LAYOUT ==================== */
        #appContainer { display: none; height: 100%; }
        #appContainer.visible { display: flex; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-logo { font-size: 1.5rem; font-weight: 700; color: var(--text); }
        .sidebar-logo span { color: var(--accent); }
        
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        
        .nav-section { margin-bottom: 24px; }
        
        .nav-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 12px;
            margin-bottom: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            border: none;
            background: none;
            width: 100%;
            font-family: inherit;
            font-size: 0.9rem;
            text-align: left;
        }
        .nav-item:hover { background: var(--bg-card); color: var(--text); }
        .nav-item.active { background: var(--accent-soft); color: var(--accent); }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        
        .nav-item-badge {
            margin-left: auto;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-card:hover { background: var(--bg-elevated); }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-weight: 500; color: var(--text); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .header-title { font-size: 1.25rem; font-weight: 600; color: var(--text); }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: var(--bg-elevated); color: var(--text); }
        .icon-btn svg { width: 20px; height: 20px; }
        
        .hamburger { display: none; }
        
        /* Content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }
        
        .stat-value { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
        .stat-value.purple { color: var(--accent); }
        .stat-value.green { color: var(--success); }
        .stat-value.orange { color: var(--warning); }
        .stat-value.blue { color: var(--info); }
        
        .stat-label { font-size: 0.8rem; color: var(--text-muted); }
        
        /* Section */
        .section { margin-bottom: 32px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        
        /* Cards */
        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .link-card:hover { border-color: var(--border-hover); }
        .link-card.hot { border-left: 3px solid var(--warning); }
        
        .link-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .link-info { flex: 1; min-width: 0; }
        .link-name { font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .link-url { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .link-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-left: 12px; flex-shrink: 0; }
        .link-badge.hot { background: rgba(245,158,11,0.15); color: var(--warning); }
        .link-badge.warm { background: rgba(34,197,94,0.15); color: var(--success); }
        .link-badge.cold { background: var(--bg-elevated); color: var(--text-muted); }
        
        .link-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .link-stat { background: var(--bg-elevated); border-radius: 8px; padding: 10px; text-align: center; }
        .link-stat-value { font-size: 1rem; font-weight: 700; color: var(--text); }
        .link-stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        
        /* Page Card */
        .page-card {
            background: linear-gradient(135deg, var(--accent-soft), rgba(168,85,247,0.05));
            border: 1px solid rgba(168,85,247,0.2);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-card:hover { border-color: var(--accent); }
        
        .page-header { display: flex; align-items: center; gap: 12px; }
        .page-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; }
        .page-info { flex: 1; min-width: 0; }
        .page-name { font-weight: 600; color: var(--text); }
        .page-url { font-size: 0.8rem; color: var(--accent); }
        
        .pro-badge { background: var(--accent); color: white; font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        
        /* QR Card */
        .qr-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qr-card:hover { border-color: var(--border-hover); }
        
        .qr-thumb { width: 60px; height: 60px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .qr-thumb canvas, .qr-thumb img { width: 48px !important; height: 48px !important; }
        .qr-info { flex: 1; min-width: 0; }
        .qr-name { font-weight: 600; color: var(--text); }
        .qr-stats { font-size: 0.85rem; color: var(--text-secondary); }
        .qr-stats span { color: var(--accent); font-weight: 600; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { width: 64px; height: 64px; background: var(--bg-card); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--text-muted); }
        .empty-icon svg { width: 28px; height: 28px; }
        .empty-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .empty-text { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        
        /* Pricing */
        .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        
        .pricing-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            transition: all 0.2s;
        }
        .pricing-card:hover { border-color: var(--border-hover); }
        .pricing-card.popular { border-color: var(--accent); }
        .pricing-card.popular::before {
            content: 'POPULAR';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .pricing-name { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .pricing-price { font-size: 2.5rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .pricing-price span { font-size: 1rem; font-weight: 400; color: var(--text-muted); }
        .pricing-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        
        .pricing-features { text-align: left; margin-bottom: 24px; }
        .pricing-feature { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 0.9rem; color: var(--text-secondary); }
        .pricing-feature svg { width: 16px; height: 16px; color: var(--success); flex-shrink: 0; }
        
        .pricing-btn { width: 100%; }
        .pricing-btn.current { background: var(--bg-elevated); color: var(--text-muted); cursor: default; }
        
        /* Settings */
        .settings-section { margin-bottom: 32px; }
        .settings-title { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-item:hover { border-color: var(--border-hover); }
        .settings-item.disabled { opacity: 0.5; cursor: not-allowed; }
        
        .settings-item-left { display: flex; align-items: center; gap: 12px; }
        .settings-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .settings-icon svg { width: 20px; height: 20px; }
        .settings-icon.purple { background: var(--accent-soft); color: var(--accent); }
        .settings-icon.green { background: rgba(34,197,94,0.15); color: var(--success); }
        .settings-icon.blue { background: rgba(59,130,246,0.15); color: var(--info); }
        .settings-icon.red { background: rgba(239,68,68,0.15); color: var(--danger); }
        
        .settings-item-info { flex: 1; }
        .settings-item-title { font-weight: 500; color: var(--text); font-size: 0.95rem; }
        .settings-item-desc { font-size: 0.8rem; color: var(--text-muted); }
        
        .toggle { width: 48px; height: 28px; background: var(--bg-elevated); border-radius: 14px; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .toggle.active { background: var(--accent); }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; background: white; border-radius: 50%; transition: transform 0.2s; }
        .toggle.active::after { transform: translateX(20px); }
        .toggle.disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Views */
        .view { display: none; }
        .view.active { display: block; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            z-index: 201;
            width: 90%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .modal-content { padding: 24px; }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text); }
        .modal-close svg { width: 18px; height: 18px; }
        
        /* Action Grid */
        .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-item:hover { background: var(--bg-card); border-color: var(--border-hover); }
        
        .action-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .action-icon svg { width: 24px; height: 24px; }
        .action-icon.blue { background: rgba(59,130,246,0.15); color: var(--info); }
        .action-icon.purple { background: var(--accent-soft); color: var(--accent); }
        .action-icon.green { background: rgba(34,197,94,0.15); color: var(--success); }
        
        .action-label { font-size: 0.85rem; font-weight: 500; color: var(--text); }
        .action-badge { font-size: 0.6rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
        
        /* QR Preview */
        .qr-preview-box {
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 16px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .qr-preview-box canvas, .qr-preview-box img { width: 140px !important; height: 140px !important; }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 360px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 300;
            transform: translateX(120%);
            transition: transform 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .toast.show { transform: translateX(0); }
        
        .toast-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .toast-icon svg { width: 18px; height: 18px; }
        .toast-icon.success { background: rgba(34,197,94,0.15); color: var(--success); }
        .toast-icon.error { background: rgba(239,68,68,0.15); color: var(--danger); }
        
        .toast-content { flex: 1; min-width: 0; }
        .toast-title { font-weight: 600; color: var(--text); font-size: 0.9rem; }
        .toast-msg { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* FAB */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: var(--accent);
            border: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: all 0.2s;
            z-index: 90;
            color: white;
        }
        .fab:hover { transform: scale(1.05); }
        .fab svg { width: 24px; height: 24px; }
        
        /* Mobile */
        @media (max-width: 1024px) {
            .sidebar { display: none; position: fixed; left: 0; top: 0; bottom: 0; z-index: 150; }
            .sidebar.open { display: flex; }
            .hamburger { display: flex; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .pricing-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 640px) {
            .app-content { padding: 16px; }
            .modal { width: 95%; }
        }
    </style>
</head>
<body>
    <!-- ==================== LOGIN ==================== -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">N<span>o</span>ly</div>
                <p class="login-subtitle">Get alerted when prospects view your links.<br>Follow up at the perfect moment.</p>
            </div>
            <div class="login-card">
                <div id="loginForm" class="form-toggle active">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Enter password">
                    </div>
                    <button type="button" class="btn btn-primary" id="loginBtn">Sign In</button>
                    <div style="text-align:center;margin-top:16px;">
                        <a href="#" id="forgotPasswordLink" style="color:var(--accent);font-size:0.9rem;text-decoration:none;">Forgot password?</a>
                    </div>
                </div>
                <div id="registerForm" class="form-toggle">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-input" id="registerName" placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="registerPassword" placeholder="Min. 6 characters">
                    </div>
                    <button type="button" class="btn btn-primary" id="registerBtn">Create Account</button>
                </div>
                <div id="resetForm" class="form-toggle">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="resetEmail" placeholder="you@example.com">
                    </div>
                    <button type="button" class="btn btn-primary" id="resetBtn">Send Reset Link</button>
                    <div style="text-align:center;margin-top:16px;">
                        <a href="#" id="backToLoginLink" style="color:var(--text-secondary);font-size:0.9rem;text-decoration:none;">← Back to login</a>
                    </div>
                </div>
                <div id="newPasswordForm" class="form-toggle">
                    <p style="color:var(--text-secondary);margin-bottom:20px;text-align:center;">Enter your new password</p>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-input" id="newPassword" placeholder="Min. 6 characters">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm password">
                    </div>
                    <input type="hidden" id="resetTokenInput">
                    <button type="button" class="btn btn-primary" id="newPasswordBtn">Set New Password</button>
                </div>
            </div>
            <div class="login-footer">
                <span id="switchText">Don't have an account? <a href="#" id="switchLink">Sign up</a></span>
            </div>
        </div>
    </div>
    
    <!-- ==================== APP ==================== -->
    <div id="appContainer">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">N<span>o</span>ly</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="user-card" id="userCard">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="user-info">
                        <div class="user-name" id="userName">User</div>
                        <div class="user-email" id="userEmail">user@email.com</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Main -->
        <div class="main">
            <header class="app-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="icon-btn hamburger" id="hamburgerBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                    <h1 class="header-title" id="headerTitle">Dashboard</h1>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="refreshBtn" title="Refresh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                </div>
            </header>
            
            <main class="app-content" id="appContent"></main>
        </div>
        
        <!-- FAB -->
        <button class="fab" id="fabBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
    
    <!-- ==================== MODALS ==================== -->
    <div class="modal-overlay" id="modalOverlay"></div>
    
    <div class="modal" id="createModal">
        <button class="modal-close" onclick="closeAllModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="modal-header"><div class="modal-title">Create New</div></div>
        <div class="modal-content">
            <div class="action-grid">
                <button class="action-item" id="actionLink">
                    <div class="action-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
                    <span class="action-label">Link</span>
                </button>
                <button class="action-item" id="actionPage">
                    <div class="action-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg></div>
                    <span class="action-label">Page</span>
                    <span class="action-badge">PRO</span>
                </button>
                <button class="action-item" id="actionQR">
                    <div class="action-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h7v7h-7z"/></svg></div>
                    <span class="action-label">QR Code</span>
                    <span class="action-badge">PRO</span>
                </button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="linkModal">
        <button class="modal-close" onclick="closeAllModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="modal-header"><div class="modal-title">New Tracked Link</div></div>
        <div class="modal-content">
            <div class="form-group">
                <label class="form-label">Destination URL</label>
                <input type="url" class="form-input" id="newLinkUrl" placeholder="https://example.com/proposal.pdf">
            </div>
            <div class="form-group">
                <label class="form-label">Link Name</label>
                <input type="text" class="form-input" id="newLinkName" placeholder="Q1 Proposal - Client">
            </div>
            <button type="button" class="btn btn-primary" id="createLinkBtn">Create Link</button>
        </div>
    </div>
    
    <div class="modal" id="pageModal">
        <button class="modal-close" onclick="closeAllModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="modal-header"><div class="modal-title">New Smart Page</div></div>
        <div class="modal-content">
            <div class="form-group">
                <label class="form-label">Page Name</label>
                <input type="text" class="form-input" id="newPageName" placeholder="My Portfolio">
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="newPageUsername" placeholder="yourname">
            </div>
            <button type="button" class="btn btn-primary" id="createPageBtn">Create Page</button>
        </div>
    </div>
    
    <div class="modal" id="qrModal">
        <button class="modal-close" onclick="closeAllModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="modal-header"><div class="modal-title">New QR Code</div></div>
        <div class="modal-content">
            <div class="form-group">
                <label class="form-label">Destination URL</label>
                <input type="url" class="form-input" id="newQRUrl" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label class="form-label">QR Name</label>
                <input type="text" class="form-input" id="newQRName" placeholder="Business Card">
            </div>
            <div class="qr-preview-box" id="qrPreviewBox"><span style="color:#999;font-size:0.85rem;">Enter URL</span></div>
            <button type="button" class="btn btn-primary" id="createQRBtn">Create QR Code</button>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon success" id="toastIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle">Success</div>
            <div class="toast-msg" id="toastMsg">Done</div>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        var API_BASE = 'https://go.noly.pro';
        var token = null;
        var user = null;
        var userPlan = 'free';
        var linksData = [];
        var pagesData = [];
        var qrData = [];
        var currentView = 'dashboard';
        
        // ==================== ICONS ====================
        var ICONS = {
            dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
            link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
            page: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
            qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h7v7h-7z"/></svg>',
            pricing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>',
            settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
            error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'
        };
        
        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            var savedToken = localStorage.getItem('noly_token');
            var savedUser = localStorage.getItem('noly_user');
            
            // Check for reset token in URL
            var urlParams = new URLSearchParams(window.location.search);
            var resetToken = urlParams.get('reset');
            
            if (resetToken) {
                showNewPasswordForm(resetToken);
            } else if (savedToken && savedUser) {
                token = savedToken;
                user = JSON.parse(savedUser);
                userPlan = user.plan || 'free';
                showApp();
                loadAllData();
            }
            
            // Check for payment status
            var paymentStatus = urlParams.get('payment');
            if (paymentStatus === 'success') {
                showToast('Success', 'Payment successful! Welcome to Pro.', 'success');
                window.history.replaceState({}, '', window.location.pathname);
            } else if (paymentStatus === 'cancelled') {
                showToast('Info', 'Payment cancelled', 'error');
                window.history.replaceState({}, '', window.location.pathname);
            }
            
            setupEvents();
        });
        
        // ==================== EVENTS ====================
        function setupEvents() {
            // Use event delegation for login screen - robust against DOM modifications
            var loginScreen = document.getElementById('loginScreen');
            if (loginScreen) {
                loginScreen.addEventListener('click', function(e) {
                    var target = e.target;
                    var id = target.id;

                    // Handle button clicks
                    if (id === 'loginBtn' || target.closest('#loginBtn')) {
                        e.preventDefault();
                        handleLogin();
                        return;
                    }
                    if (id === 'registerBtn' || target.closest('#registerBtn')) {
                        e.preventDefault();
                        handleRegister();
                        return;
                    }
                    if (id === 'resetBtn' || target.closest('#resetBtn')) {
                        e.preventDefault();
                        handleResetPassword();
                        return;
                    }
                    if (id === 'newPasswordBtn' || target.closest('#newPasswordBtn')) {
                        e.preventDefault();
                        handleNewPassword();
                        return;
                    }

                    // Handle link clicks
                    if (id === 'switchLink' || target.closest('#switchLink')) {
                        e.preventDefault();
                        toggleAuthForms();
                        return;
                    }
                    if (id === 'forgotPasswordLink' || target.closest('#forgotPasswordLink')) {
                        e.preventDefault();
                        showResetForm();
                        return;
                    }
                    if (id === 'backToLoginLink' || target.closest('#backToLoginLink')) {
                        e.preventDefault();
                        showLoginForm();
                        return;
                    }
                });

                // Keyboard events for Enter key
                loginScreen.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        var id = e.target.id;
                        if (id === 'loginEmail' || id === 'loginPassword') {
                            handleLogin();
                        } else if (id === 'registerName' || id === 'registerEmail' || id === 'registerPassword') {
                            handleRegister();
                        } else if (id === 'resetEmail') {
                            handleResetPassword();
                        } else if (id === 'newPassword' || id === 'confirmPassword') {
                            handleNewPassword();
                        }
                    }
                });
            }

            // App events with addEventListener for robustness
            var refreshBtn = document.getElementById('refreshBtn');
            var hamburgerBtn = document.getElementById('hamburgerBtn');
            var fabBtn = document.getElementById('fabBtn');
            var modalOverlay = document.getElementById('modalOverlay');
            var actionLink = document.getElementById('actionLink');
            var actionPage = document.getElementById('actionPage');
            var actionQR = document.getElementById('actionQR');
            var createLinkBtn = document.getElementById('createLinkBtn');
            var createPageBtn = document.getElementById('createPageBtn');
            var createQRBtn = document.getElementById('createQRBtn');
            var newQRUrl = document.getElementById('newQRUrl');
            var userCard = document.getElementById('userCard');

            if (refreshBtn) refreshBtn.addEventListener('click', loadAllData);
            if (hamburgerBtn) hamburgerBtn.addEventListener('click', function() { document.getElementById('sidebar').classList.toggle('open'); });
            if (fabBtn) fabBtn.addEventListener('click', function() { openModal('createModal'); });
            if (modalOverlay) modalOverlay.addEventListener('click', closeAllModals);

            if (actionLink) actionLink.addEventListener('click', function() {
                closeAllModals();
                setTimeout(function() { openModal('linkModal'); }, 150);
            });
            if (actionPage) actionPage.addEventListener('click', function() {
                if (userPlan === 'free') { switchView('pricing'); closeAllModals(); return; }
                closeAllModals();
                setTimeout(function() { openModal('pageModal'); }, 150);
            });
            if (actionQR) actionQR.addEventListener('click', function() {
                if (userPlan === 'free') { switchView('pricing'); closeAllModals(); return; }
                closeAllModals();
                setTimeout(function() { openModal('qrModal'); }, 150);
            });

            if (createLinkBtn) createLinkBtn.addEventListener('click', createLink);
            if (createPageBtn) createPageBtn.addEventListener('click', createPage);
            if (createQRBtn) createQRBtn.addEventListener('click', createQR);
            if (newQRUrl) newQRUrl.addEventListener('input', updateQRPreview);
            if (userCard) userCard.addEventListener('click', function() { switchView('settings'); });
        }

        function toggleAuthForms() {
            var loginForm = document.getElementById('loginForm');
            var registerForm = document.getElementById('registerForm');
            var switchText = document.getElementById('switchText');

            if (loginForm.classList.contains('active')) {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                switchText.innerHTML = 'Already have an account? <a href="#" id="switchLink">Sign in</a>';
            } else {
                registerForm.classList.remove('active');
                loginForm.classList.add('active');
                switchText.innerHTML = 'Don\'t have an account? <a href="#" id="switchLink">Sign up</a>';
            }
            // No need to reattach - event delegation handles it
        }
        
        // ==================== AUTH ====================
        function handleLogin() {
            var email = document.getElementById('loginEmail').value;
            var password = document.getElementById('loginPassword').value;
            if (!email || !password) { showToast('Error', 'Enter email and password', 'error'); return; }
            
            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            
            fetch(API_BASE + '/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, password: password})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                if (data.token) {
                    token = data.token;
                    user = data.user;
                    userPlan = user.plan || 'free';
                    localStorage.setItem('noly_token', token);
                    localStorage.setItem('noly_user', JSON.stringify(user));
                    showToast('Welcome!', 'Login successful', 'success');
                    showApp();
                    loadAllData();
                } else {
                    showToast('Error', data.error || 'Login failed', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                showToast('Error', 'Connection failed', 'error');
            });
        }
        
        function handleRegister() {
            var name = document.getElementById('registerName').value;
            var email = document.getElementById('registerEmail').value;
            var password = document.getElementById('registerPassword').value;
            if (!email || !password) { showToast('Error', 'Enter email and password', 'error'); return; }
            if (password.length < 6) { showToast('Error', 'Password min 6 characters', 'error'); return; }
            
            var btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            fetch(API_BASE + '/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, email: email, password: password})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Create Account';
                if (data.token) {
                    token = data.token;
                    user = data.user;
                    userPlan = user.plan || 'free';
                    localStorage.setItem('noly_token', token);
                    localStorage.setItem('noly_user', JSON.stringify(user));
                    showToast('Welcome!', 'Account created', 'success');
                    showApp();
                    loadAllData();
                } else {
                    showToast('Error', data.error || 'Registration failed', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Create Account';
                showToast('Error', 'Connection failed', 'error');
            });
        }
        
        function handleLogout() {
            if (confirm('Logout?')) {
                token = null;
                user = null;
                localStorage.removeItem('noly_token');
                localStorage.removeItem('noly_user');
                location.reload();
            }
        }
        
        function showResetForm() {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('resetForm').classList.add('active');
            document.getElementById('switchText').style.display = 'none';
        }
        
        function showLoginForm() {
            document.getElementById('resetForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('switchText').style.display = 'block';
        }
        
        function handleResetPassword() {
            var email = document.getElementById('resetEmail').value;
            if (!email) { showToast('Error', 'Enter your email', 'error'); return; }
            
            var btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            
            fetch(API_BASE + '/api/auth/forgot-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
                if (data.success) {
                    showToast('Success', 'Reset link sent to your email', 'success');
                    document.getElementById('resetEmail').value = '';
                    showLoginForm();
                } else {
                    showToast('Error', data.error || 'Failed to send reset link', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
                showToast('Error', 'Connection failed', 'error');
            });
        }
        
        function showNewPasswordForm(resetToken) {
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('resetForm').classList.remove('active');
            document.getElementById('newPasswordForm').classList.add('active');
            document.getElementById('switchText').style.display = 'none';
            document.getElementById('resetTokenInput').value = resetToken;
        }
        
        function handleNewPassword() {
            var password = document.getElementById('newPassword').value;
            var confirmPass = document.getElementById('confirmPassword').value;
            var resetToken = document.getElementById('resetTokenInput').value;
            
            if (!password) { showToast('Error', 'Enter a password', 'error'); return; }
            if (password.length < 6) { showToast('Error', 'Password must be at least 6 characters', 'error'); return; }
            if (password !== confirmPass) { showToast('Error', 'Passwords do not match', 'error'); return; }
            
            var btn = document.getElementById('newPasswordBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';
            
            fetch(API_BASE + '/api/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: resetToken, password: password})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Set New Password';
                if (data.success) {
                    showToast('Success', 'Password changed! You can now login.', 'success');
                    window.history.replaceState({}, '', window.location.pathname);
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    showLoginForm();
                } else {
                    showToast('Error', data.error || 'Failed to change password', 'error');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Set New Password';
                showToast('Error', 'Connection failed', 'error');
            });
        }

        // ==================== API ====================
        function apiRequest(endpoint, options) {
            options = options || {};
            var headers = {'Content-Type': 'application/json'};
            if (token) headers['Authorization'] = 'Bearer ' + token;
            
            return fetch(API_BASE + endpoint, {
                method: options.method || 'GET',
                headers: headers,
                body: options.body
            })
            .then(function(r) {
                if (r.status === 401 || r.status === 403) {
                    localStorage.removeItem('noly_token');
                    localStorage.removeItem('noly_user');
                    location.reload();
                    throw new Error('Unauthorized');
                }
                return r.json();
            });
        }
        
        function loadAllData() {
            apiRequest('/api/stats').then(function(data) {
                window.statsData = data || {};
                if (currentView === 'dashboard') renderDashboard();
            }).catch(function() {});

            apiRequest('/api/links').then(function(data) {
                // API returns {success: true, links: [...]} - extract the links array
                linksData = (data && data.links) ? data.links : [];
                if (currentView === 'dashboard' || currentView === 'links') {
                    if (currentView === 'dashboard') renderDashboard();
                    else renderLinks();
                }
            }).catch(function() { linksData = []; });

            apiRequest('/api/pages').then(function(data) {
                // API returns {success: true, pages: [...]} - extract the pages array
                pagesData = (data && data.pages) ? data.pages : [];
                if (currentView === 'pages') renderPages();
            }).catch(function() { pagesData = []; });

            apiRequest('/api/qr').then(function(data) {
                // API returns {success: true, qrs: [...]} - extract the qrs array
                qrData = (data && data.qrs) ? data.qrs : [];
                if (currentView === 'qr') renderQR();
            }).catch(function() { qrData = []; });
        }

        function createLink() {
            var url = document.getElementById('newLinkUrl').value;
            var name = document.getElementById('newLinkName').value;
            
            if (!url) { showToast('Error', 'URL is required', 'error'); return; }
            if (!url.startsWith('http')) { showToast('Error', 'URL must start with http:// or https://', 'error'); return; }
            
            var btn = document.getElementById('createLinkBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            apiRequest('/api/links', {
                method: 'POST',
                body: JSON.stringify({original_url: url, name: name || 'Untitled Link'})
            })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Create Link';
                
                if (data.short_code) {
                    showToast('Link created!', API_BASE + '/' + data.short_code, 'success');
                    closeAllModals();
                    document.getElementById('newLinkUrl').value = '';
                    document.getElementById('newLinkName').value = '';
                    loadAllData();
                } else {
                    showToast('Error', data.error || data.message || 'Failed to create link', 'error');
                }
            })
            .catch(function(e) {
                btn.disabled = false;
                btn.textContent = 'Create Link';
                showToast('Error', 'Failed to create link', 'error');
            });
        }

        }
        
        function copyUrl(url) {
            navigator.clipboard.writeText(url);
            showToast('Copied!', url, 'success');
        }
        
        function showToast(title, msg, type) {
            var icon = document.getElementById('toastIcon');
            icon.className = 'toast-icon ' + (type || 'success');
            icon.innerHTML = (type === 'error') ? ICONS.error : ICONS.check;
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toast').classList.add('show');
            setTimeout(function() { document.getElementById('toast').classList.remove('show'); }, 3000);
        }
        
        function escapeHTML(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            var diff = Date.now() - new Date(dateStr);
            if (diff < 60000) return 'now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            return Math.floor(diff / 86400000) + 'd ago';
        }
        
        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(function() {
                showToast('Copied!', url, 'success');
            }).catch(function() {
                showToast('Error', 'Failed to copy', 'error');
            });
        }
        
        function upgradePlan(plan) {
            if (!token) return;
            
            fetch(API_BASE + '/api/stripe/checkout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ plan: plan })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    showToast('Error', data.error || 'Payment error', 'error');
                }
            })
            .catch(function() {
                showToast('Error', 'Connection failed', 'error');
            });
        }
    </script>
</body>
</html>
